[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["jinja2>=3.1.6", "lief>=0.17.6", "typer>=0.12.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.12",
    "pyright>=1.1.390",
]

[project.scripts]
binary-gen = "binary_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binary_gen"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
