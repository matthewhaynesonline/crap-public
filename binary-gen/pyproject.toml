[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-gen"
version = "0.1.0"
description = "Minimal Linux x86_64 ELF and macOS ARM64 Mach-O builders"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["lief>=0.17.6", "typer>=0.12.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.12",
    "pyright>=1.1.390",
]

[project.scripts]
binary-gen = "binary_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binary_gen"]
