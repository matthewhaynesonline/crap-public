[project]
name = "crap"
version = "0.1.0"
description = "Workspace root for binary-gen and the Python demo"
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.12",
  "pyright>=1.1.390",
  "pre-commit>=4.6.0",
]
# Optional CUDA attention kernel for the Python inference demo.
# Install after the main workspace because its build imports torch.
cuda = ["flash-attn>=2.8 ; sys_platform == 'linux'"]

[tool.uv]
package = false          # virtual workspace root, never gets built/published
default-groups = ["dev"]
# flash-attn's setup.py imports torch, so it can't build in an isolated env;
# it must compile against the torch already installed in the venv.
no-build-isolation-package = ["flash-attn"]

# flash-attn's sdist needs torch importable even to *resolve* metadata;
# declaring it here lets `uv lock` succeed without building it.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.workspace]
members = ["binary-gen", "demo"]

[tool.pyright]
strict = ["binary-gen/src/binary_gen/core/runner", "demo/src/demo/tool_calls.py"]
include = ["binary-gen/src", "demo/src", "tests"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "binary-gen"
extraPaths = ["binary-gen/src"]

[[tool.pyright.executionEnvironments]]
root = "demo"
extraPaths = ["binary-gen/src", "demo/src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PT"]
ignore = ["E501"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["binary-gen/src", "demo/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["binary-gen/src", "demo/src"]
addopts = ["--strict-markers", "--strict-config"]
