[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo"
version = "0.1.0"
description = "Gradio demo: fine-tuned binary generation vs base model + tool calling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "binary-gen",
  "gradio>=6.0.0",
  "transformers>=5.9.0",
  "peft>=0.19.1",
  "torch>=2.12.0",
  "accelerate>=1.13.0",
]

[dependency-groups]
dev = ["ruff>=0.15.12", "pyright>=1.1.390"]

[project.scripts]
demo = "demo.app:main"
demo-dev = "demo.__main__:dev"

[tool.uv.sources]
binary-gen = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]
